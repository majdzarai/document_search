# =============================================================================
# RAG Service - Project Configuration
# =============================================================================
# This file configures the Python project using modern standards.
#
# pyproject.toml is the modern way to configure Python projects, replacing
# setup.py, setup.cfg, and various tool-specific config files.
#
# Reference: https://packaging.python.org/en/latest/specifications/pyproject-toml/
# =============================================================================

[build-system]
# Build system requirements for creating distributable packages
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Project metadata
name = "rag-service"
version = "0.1.0"
description = "Production-grade RAG (Retrieval-Augmented Generation) Engine API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "RAG Service Team", email = "support@example.com"}
]
keywords = ["rag", "llm", "api", "fastapi", "ai", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies (same as requirements.txt)
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
]

[project.optional-dependencies]
# Development dependencies - install with: pip install -e ".[dev]"
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",  # For testing FastAPI
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

# Production dependencies - install with: pip install -e ".[prod]"
prod = [
    "gunicorn>=21.2.0",
]

[project.urls]
Homepage = "https://github.com/example/rag-service"
Documentation = "https://github.com/example/rag-service#readme"
Repository = "https://github.com/example/rag-service.git"
Issues = "https://github.com/example/rag-service/issues"

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.setuptools.packages.find]
# Tell setuptools where to find packages
where = ["."]
include = ["src*"]

[tool.black]
# Black code formatter configuration
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.ruff]
# Ruff linter configuration (fast Python linter)
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
# MyPy type checker configuration
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests", "build", "dist"]

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
